<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a365d"/>
      <stop offset="100%" style="stop-color:#2c5282"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="80" fill="url(#bg)"/>
  <g transform="translate(256, 256)">
    <!-- Book icon -->
    <g transform="translate(-80, -60)">
      <rect x="0" y="0" width="160" height="120" rx="8" fill="#d69e2e"/>
      <rect x="10" y="10" width="60" height="100" rx="4" fill="#fff"/>
      <rect x="80" y="10" width="70" height="100" rx="4" fill="#fff"/>
      <line x1="45" y1="30" x2="45" y2="90" stroke="#e2e8f0" stroke-width="2"/>
      <line x1="20" y1="30" x2="60" y2="30" stroke="#1a365d" stroke-width="3"/>
      <line x1="20" y1="45" x2="55" y2="45" stroke="#718096" stroke-width="2"/>
      <line x1="20" y1="55" x2="50" y2="55" stroke="#718096" stroke-width="2"/>
      <line x1="20" y1="65" x2="55" y2="65" stroke="#718096" stroke-width="2"/>
      <line x1="90" y1="30" x2="140" y2="30" stroke="#1a365d" stroke-width="3"/>
      <line x1="90" y1="45" x2="135" y2="45" stroke="#718096" stroke-width="2"/>
      <line x1="90" y1="55" x2="130" y2="55" stroke="#718096" stroke-width="2"/>
    </g>
    <!-- Pen icon -->
    <g transform="translate(60, 50) rotate(45)">
      <rect x="-8" y="-60" width="16" height="80" rx="2" fill="#d69e2e"/>
      <polygon points="-8,20 8,20 0,40" fill="#1a365d"/>
      <rect x="-8" y="-60" width="16" height="10" fill="#e53e3e"/>
    </g>
  </g>
  <!-- Text -->
  <text x="256" y="400" font-family="Arial, sans-serif" font-size="48" font-weight="bold" fill="white" text-anchor="middle">ÉCRILUXE</text>
</svg>
