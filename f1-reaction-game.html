<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jeu de Réaction F1</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Arial', sans-serif;
            background: linear-gradient(135deg, #1a1a1a 0%, #2d2d2d 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            color: white;
            padding: 20px;
        }

        .container {
            text-align: center;
            max-width: 800px;
            width: 100%;
        }

        h1 {
            font-size: 3em;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
        }

        .subtitle {
            font-size: 1.2em;
            color: #e10600;
            margin-bottom: 40px;
            font-weight: bold;
        }

        .lights-container {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin: 40px 0;
            flex-wrap: wrap;
        }

        .light {
            width: 80px;
            height: 120px;
            background: #1a1a1a;
            border: 4px solid #333;
            border-radius: 10px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 10px;
            box-shadow: 0 0 20px rgba(0,0,0,0.5);
            transition: all 0.3s ease;
        }

        .light-bulb {
            width: 50px;
            height: 50px;
            background: #2a2a2a;
            border-radius: 50%;
            box-shadow: inset 0 0 10px rgba(0,0,0,0.5);
            transition: all 0.2s ease;
        }

        .light.on .light-bulb {
            background: radial-gradient(circle, #ff0000 0%, #cc0000 100%);
            box-shadow: 0 0 30px #ff0000, 0 0 60px #ff0000, inset 0 0 10px #ffaaaa;
        }

        .light.off .light-bulb {
            background: #2a2a2a;
            box-shadow: inset 0 0 10px rgba(0,0,0,0.5);
        }

        .info-panel {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 15px;
            padding: 30px;
            margin: 30px 0;
            backdrop-filter: blur(10px);
        }

        .result {
            font-size: 2.5em;
            font-weight: bold;
            margin: 20px 0;
            min-height: 60px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .result.good {
            color: #00ff00;
        }

        .result.excellent {
            color: #ffd700;
        }

        .result.too-early {
            color: #ff0000;
        }

        .instruction {
            font-size: 1.3em;
            margin: 20px 0;
            color: #cccccc;
        }

        .btn {
            background: linear-gradient(135deg, #e10600 0%, #ff1e00 100%);
            color: white;
            border: none;
            padding: 20px 50px;
            font-size: 1.5em;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 5px 20px rgba(225, 6, 0, 0.4);
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 30px rgba(225, 6, 0, 0.6);
        }

        .btn:active {
            transform: translateY(-1px);
        }

        .btn:disabled {
            background: #555;
            cursor: not-allowed;
            box-shadow: none;
        }

        .scoreboard {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 15px;
            padding: 20px;
            margin-top: 30px;
        }

        .scoreboard h2 {
            color: #e10600;
            margin-bottom: 15px;
        }

        .score-list {
            list-style: none;
            padding: 0;
        }

        .score-item {
            display: flex;
            justify-content: space-between;
            padding: 10px 20px;
            margin: 5px 0;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            font-size: 1.1em;
        }

        .score-item.best {
            background: linear-gradient(135deg, rgba(255, 215, 0, 0.3) 0%, rgba(255, 215, 0, 0.1) 100%);
            border: 2px solid #ffd700;
        }

        .medal {
            margin-right: 10px;
        }

        @media (max-width: 600px) {
            h1 {
                font-size: 2em;
            }

            .light {
                width: 50px;
                height: 80px;
            }

            .light-bulb {
                width: 35px;
                height: 35px;
            }

            .btn {
                padding: 15px 30px;
                font-size: 1.2em;
            }

            .result {
                font-size: 1.8em;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🏎️ Jeu de Réaction F1</h1>
        <p class="subtitle">Testez votre temps de réaction comme un pilote de Formule 1 !</p>

        <div class="lights-container">
            <div class="light" id="light1">
                <div class="light-bulb"></div>
            </div>
            <div class="light" id="light2">
                <div class="light-bulb"></div>
            </div>
            <div class="light" id="light3">
                <div class="light-bulb"></div>
            </div>
            <div class="light" id="light4">
                <div class="light-bulb"></div>
            </div>
            <div class="light" id="light5">
                <div class="light-bulb"></div>
            </div>
        </div>

        <div class="info-panel">
            <p class="instruction" id="instruction">
                Cliquez sur "DÉMARRER" pour commencer. Les feux vont s'allumer progressivement.
                <br>Dès qu'ils s'éteignent tous, cliquez le plus vite possible !
            </p>
            <div class="result" id="result"></div>
            <button class="btn" id="startBtn" onclick="startGame()">Démarrer</button>
        </div>

        <div class="scoreboard">
            <h2>🏆 Meilleurs Temps</h2>
            <ul class="score-list" id="scoreList">
                <li class="score-item">Aucun temps enregistré</li>
            </ul>
        </div>
    </div>

    <script>
        let gameState = 'ready'; // ready, waiting, racing, finished
        let startTime;
        let lightsOnTimeout;
        let scores = [];

        // Charger les scores depuis localStorage
        function loadScores() {
            const savedScores = localStorage.getItem('f1ReactionScores');
            if (savedScores) {
                scores = JSON.parse(savedScores);
                updateScoreboard();
            }
        }

        // Sauvegarder les scores dans localStorage
        function saveScores() {
            localStorage.setItem('f1ReactionScores', JSON.stringify(scores));
        }

        // Mettre à jour le tableau des scores
        function updateScoreboard() {
            const scoreList = document.getElementById('scoreList');

            if (scores.length === 0) {
                scoreList.innerHTML = '<li class="score-item">Aucun temps enregistré</li>';
                return;
            }

            // Trier les scores (du meilleur au moins bon)
            scores.sort((a, b) => a - b);

            // Garder seulement les 5 meilleurs
            scores = scores.slice(0, 5);

            scoreList.innerHTML = scores.map((score, index) => {
                const medal = index === 0 ? '🥇' : index === 1 ? '🥈' : index === 2 ? '🥉' : '🏁';
                const bestClass = index === 0 ? 'best' : '';
                return `<li class="score-item ${bestClass}">
                    <span><span class="medal">${medal}</span> Tentative ${index + 1}</span>
                    <span>${score} ms</span>
                </li>`;
            }).join('');
        }

        function startGame() {
            if (gameState !== 'ready') return;

            gameState = 'waiting';
            document.getElementById('startBtn').disabled = true;
            document.getElementById('result').textContent = '';
            document.getElementById('instruction').textContent = 'Attendez que tous les feux s\'éteignent...';

            // Éteindre tous les feux
            for (let i = 1; i <= 5; i++) {
                document.getElementById('light' + i).className = 'light off';
            }

            // Allumer les feux progressivement (comme en F1)
            setTimeout(() => document.getElementById('light1').className = 'light on', 1000);
            setTimeout(() => document.getElementById('light2').className = 'light on', 2000);
            setTimeout(() => document.getElementById('light3').className = 'light on', 3000);
            setTimeout(() => document.getElementById('light4').className = 'light on', 4000);
            setTimeout(() => document.getElementById('light5').className = 'light on', 5000);

            // Délai aléatoire avant extinction (entre 1 et 3 secondes après le dernier feu)
            const randomDelay = 1000 + Math.random() * 2000;

            lightsOnTimeout = setTimeout(() => {
                // Éteindre tous les feux en même temps
                for (let i = 1; i <= 5; i++) {
                    document.getElementById('light' + i).className = 'light off';
                }

                gameState = 'racing';
                startTime = Date.now();
                document.getElementById('instruction').textContent = 'MAINTENANT ! CLIQUEZ !';
            }, 5000 + randomDelay);
        }

        function handleClick() {
            if (gameState === 'racing') {
                const reactionTime = Date.now() - startTime;
                gameState = 'finished';

                let resultText = '';
                let resultClass = '';

                if (reactionTime < 100) {
                    resultText = `${reactionTime} ms - Incroyable ! 🔥`;
                    resultClass = 'excellent';
                } else if (reactionTime < 200) {
                    resultText = `${reactionTime} ms - Excellent ! 🏆`;
                    resultClass = 'excellent';
                } else if (reactionTime < 300) {
                    resultText = `${reactionTime} ms - Très bien ! ✨`;
                    resultClass = 'good';
                } else if (reactionTime < 400) {
                    resultText = `${reactionTime} ms - Bien ! 👍`;
                    resultClass = 'good';
                } else {
                    resultText = `${reactionTime} ms - Pas mal ! 😊`;
                    resultClass = 'good';
                }

                const resultElement = document.getElementById('result');
                resultElement.textContent = resultText;
                resultElement.className = 'result ' + resultClass;

                // Ajouter le score
                scores.push(reactionTime);
                saveScores();
                updateScoreboard();

                document.getElementById('instruction').textContent = 'Cliquez sur "RECOMMENCER" pour faire une nouvelle tentative !';
                document.getElementById('startBtn').textContent = 'RECOMMENCER';
                document.getElementById('startBtn').disabled = false;
                gameState = 'ready';

            } else if (gameState === 'waiting') {
                // Faux départ !
                clearTimeout(lightsOnTimeout);
                gameState = 'finished';

                // Éteindre tous les feux
                for (let i = 1; i <= 5; i++) {
                    document.getElementById('light' + i).className = 'light off';
                }

                const resultElement = document.getElementById('result');
                resultElement.textContent = 'FAUX DÉPART ! ❌';
                resultElement.className = 'result too-early';

                document.getElementById('instruction').textContent = 'Vous avez cliqué trop tôt ! Attendez que tous les feux s\'éteignent. Réessayez !';
                document.getElementById('startBtn').textContent = 'RECOMMENCER';
                document.getElementById('startBtn').disabled = false;
                gameState = 'ready';
            }
        }

        // Détection du clic n'importe où sur la page
        document.addEventListener('click', function(e) {
            if (e.target.id !== 'startBtn') {
                handleClick();
            }
        });

        // Détection de la touche espace
        document.addEventListener('keydown', function(e) {
            if (e.code === 'Space' && gameState !== 'ready') {
                e.preventDefault();
                handleClick();
            }
        });

        // Charger les scores au démarrage
        loadScores();
    </script>
</body>
</html>
